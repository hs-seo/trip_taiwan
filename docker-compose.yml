services:
  taiwan-trip:
    build: .
    container_name: taiwan-trip
    restart: unless-stopped
    ports:
      - "18963:18963"
    volumes:
      - ./uploads:/app/uploads
      - ./state.json:/app/state.json
      - ./index.html:/app/index.html
      - ./style.css:/app/style.css
      - ./app.js:/app/app.js
      - ./data.js:/app/data.js
    environment:
      - PORT=18963
      - NODE_ENV=production
